<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor</title>
<link rel="stylesheet" href="katex.min.css">
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="hljs-light.css" id="hljs-light">
<link rel="stylesheet" href="hljs-dark.css" id="hljs-dark" disabled>
</head>
<body>
<script>
// 首帧前应用主题（主题经 URL ?theme= 传入），避免暗色模式下先白后暗的闪烁
(function () {
    var m = /[?&]theme=([^&]+)/.exec(location.search);
    if (m && m[1] === 'dark') {
        document.body.classList.add('dark');
        var l = document.getElementById('hljs-light');
        var d = document.getElementById('hljs-dark');
        if (l) l.disabled = true;
        if (d) d.disabled = false;
    }
})();
</script>
<div id="editor"></div>
<textarea id="source-view" style="display:none"></textarea>

<!--
  运行时依赖说明：
  TipTap v2 的官方 UMD 构建存在模块化依赖问题（需要 ProseMirror 全局对象，
  且 StarterKit 内部还依赖 ~19 个子扩展 UMD）。因此这里不逐个加载分散的 UMD 文件，
  而是加载由 esbuild 打包成的单一 bundle：tiptap-all.js。
  该 bundle 内置了 @tiptap/core、@tiptap/starter-kit、所有扩展、
  ProseMirror（state/view/model/transform/keymap/commands/schema-list）以及 lowlight/highlight.js。
  web/ 目录下保留的各独立 .js 文件为参考/原始库文件，不在此加载。
-->

<!-- 编辑器核心 bundle（TipTap + ProseMirror + 扩展 + 语法高亮） -->
<script src="katex.min.js"></script>
<script src="tiptap-all.js"></script>

<!-- Mermaid 图表渲染（esbuild 打包的自包含 IIFE，挂 window.mermaid） -->
<script src="mermaid.min.js"></script>

<!-- Qt WebChannel -->
<script src="qwebchannel.js"></script>

<!-- 编辑器初始化 -->
<script src="editor.js"></script>
</body>
</html>
