<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="56" rx="26" fill="url(#shine)"/>

  <!-- 文档页 -->
  <rect x="27" y="19" width="74" height="90" rx="10" fill="#ffffff" fill-opacity="0.97"/>

  <!-- MD 标志（整体徽标，向左/上突出文档页，类似 Word 的 W） -->
  <g>
    <rect x="10" y="8" width="42" height="22" rx="11" fill="url(#badge)"/>
    <text x="31" y="24" font-family="Verdana, Arial, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1">MD</text>
  </g>

  <!-- 文本段落 -->
  <rect x="35" y="44" width="56" height="5" rx="2" fill="#9ca3af"/>
  <rect x="35" y="53" width="50" height="4" rx="2" fill="#d4d4d8"/>
  <rect x="35" y="61" width="45" height="4" rx="2" fill="#c3c3cb"/>
  <rect x="35" y="69" width="52" height="4" rx="2" fill="#d4d4d8"/>

  <!-- 列表 -->
  <circle cx="39" cy="80" r="3" fill="#f59e0b"/>
  <rect x="47" y="78" width="38" height="4" rx="2" fill="#c3c3cb"/>
  <circle cx="39" cy="90" r="3" fill="#db2777"/>
  <rect x="47" y="88" width="30" height="4" rx="2" fill="#c3c3cb"/>

  <!-- 文本段落 -->
  <rect x="35" y="99" width="48" height="4" rx="2" fill="#d4d4d8"/>

  <!-- 编辑铅笔 (编辑) -->
  <g transform="translate(90 82) rotate(-40)">
    <rect x="-8" y="-5" width="26" height="10" rx="2" fill="url(#pencil)"/>
    <path d="M-8 -5 L-19 0 L-8 5 Z" fill="#a7f3d0"/>
    <circle cx="-23" cy="0" r="2.6" fill="#083344"/>
    <rect x="18" y="-5" width="6" height="10" rx="1.5" fill="#fb7185"/>
    <rect x="15" y="-5" width="3" height="10" fill="#e2e8f0"/>
  </g>
</svg>