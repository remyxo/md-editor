<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2471a3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#f0c090"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5dade2"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>

  <!-- 右侧装饰色块 -->
  <rect x="96" y="4" width="28" height="120" rx="12" fill="url(#accent)" opacity="0.6"/>

  <!-- 文档图标 — 折角页 -->
  <path d="M30 20 L84 20 L84 44 L84 108 L30 108 Z" fill="#fefefe" fill-opacity="0.92" stroke="none"/>
  <!-- 折角 -->
  <path d="M84 20 L84 44 L108 44 Z" fill="#e8e8e8" fill-opacity="0.8" stroke="none"/>
  <path d="M84 20 L84 44 L108 44" fill="none" stroke="#ccc" stroke-width="1"/>
  <!-- 折角内阴影 -->
  <line x1="84" y1="44" x2="108" y2="44" stroke="#ddd" stroke-width="0.5"/>
  <line x1="84" y1="20" x2="84" y2="44" stroke="#ddd" stroke-width="0.5"/>

  <!-- 标题行 # -->
  <rect x="40" y="32" width="6" height="6" rx="1" fill="url(#line)"/>
  <rect x="48" y="32" width="6" height="6" rx="1" fill="url(#line)"/>
  <rect x="56" y="32" width="28" height="6" rx="1" fill="#34495e"/>

  <!-- 二级标题 ## -->
  <rect x="40" y="46" width="18" height="5" rx="1" fill="url(#line)" opacity="0.8"/>
  <rect x="60" y="46" width="32" height="5" rx="1" fill="#7f8c8d"/>

  <!-- 文本行 -->
  <rect x="40" y="58" width="44" height="3" rx="1" fill="#bdc3c7"/>
  <rect x="40" y="65" width="38" height="3" rx="1" fill="#bdc3c7"/>
  <rect x="40" y="72" width="46" height="3" rx="1" fill="#bdc3c7"/>

  <!-- 列表 -->
  <rect x="40" y="82" width="6" height="6" rx="1" fill="url(#highlight)"/>
  <rect x="50" y="82" width="28" height="3" rx="1" fill="#bdc3c7"/>
  <rect x="40" y="92" width="6" height="6" rx="1" fill="url(#highlight)"/>
  <rect x="50" y="92" width="22" height="3" rx="1" fill="#bdc3c7"/>

  <!-- 引用竖条 -->
  <rect x="40" y="100" width="2" height="6" rx="1" fill="#e67e22"/>
  <rect x="46" y="100" width="24" height="3" rx="1" fill="#bdc3c7"/>

  <!-- M 标志 -->
  <text x="94" y="76" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#1a5276" text-anchor="middle" opacity="0.3">M</text>
  <text x="94" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#1a5276" text-anchor="middle" opacity="0.3">D</text>
</svg>
