<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#d0d4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 橡皮（斜置矩形 + 擦头分界） -->
