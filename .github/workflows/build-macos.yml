name: Build macOS Package

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest  # ARM64 (Apple Silicon)

    steps:
    - name: 检出代码
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # 获取 tag 信息

    - name: 安装 librsvg (SVG→PNG)
      run: brew install librsvg

    - name: 生成应用图标 (.icns)
      run: ./scripts/generate-icons-macos.sh

    - name: JS 测试 (vitest)
      working-directory: src/resources/web
      run: |
        npm ci
        npm test

    - name: 安装 Qt（universal，arm64 + x86_64）
      run: |
        python3 -m pip install --quiet --break-system-packages aqtinstall
        python3 -m aqt install-qt mac desktop 6.8.2 clang_64 -O "$QT_ROOT" -m qtwebengine qtwebchannel qtpositioning
      env:
        QT_ROOT: ${{ runner.tool_cache }}/Qt

    - name: 定位 Qt 前缀
      run: |
        QT_PREFIX="$(find "$QT_ROOT" -path '*/lib/cmake/Qt6/Qt6Config.cmake' | head -1)"
        QT_PREFIX="${QT_PREFIX%/lib/cmake/Qt6/Qt6Config.cmake}"
        test -n "$QT_PREFIX" || { echo "未找到 Qt"; exit 1; }
        echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
        echo "QT_PREFIX=$QT_PREFIX"
      env:
        QT_ROOT: ${{ runner.tool_cache }}/Qt

    - name: 修补 AGL 链接（macOS 26 SDK 已移除 AGL 框架）
      run: |
        python3 - "$QT_PREFIX" <<'PY'
        import pathlib, re, sys
        prefix = sys.argv[1]
        f = pathlib.Path(prefix, 'lib', 'cmake', 'Qt6', 'FindWrapOpenGL.cmake')
        s = f.read_text()
        # 彻底移除 AGL 探测块（find_library ... 到 "-framework AGL" 后的 endif）
        s = re.sub(
            r'\n[ \t]*find_library\(WrapOpenGL_AGL NAMES AGL\).*?"-framework AGL"\)\n[ \t]*endif\(\)',
            '', s, count=1, flags=re.DOTALL)
        # 移除 target_link_libraries 中的 AGL 链接引用
        s = re.sub(
            r'\n[ \t]*target_link_libraries\(WrapOpenGL::WrapOpenGL INTERFACE \$\{__opengl_agl_fw_path\}\)',
            '', s)
        f.write_text(s)
        print("残留 -framework AGL:", '-framework AGL' in s)
        print("残留 WrapOpenGL_AGL:", 'WrapOpenGL_AGL' in s)
        PY

    - name: 构建 universal (arm64 + x86_64)
      run: |
        cmake -B build -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
        echo "=== link.txt 中的 AGL 上下文 ==="
        find build -name link.txt -exec grep -o '.\{0,60\}AGL.\{0,60\}' {} \; 2>/dev/null || echo "(link.txt 无 AGL)"
        cmake --build build --parallel

    - name: 打包 dmg (macdeployqt + 签名)
      run: ./scripts/package-macos.sh

    # Release 先于制品上传：制品上传受存储配额约束（重算 6-12h 滞后），
    # 上传失败不应连坐阻断 Release（与 build-windows/deb 一致）
    - name: 发布 Release（tag 推送时）
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: md-editor-*-macos-universal.dmg
        generate_release_notes: true

    - name: 上传制品
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v7
      with:
        name: md-editor-macos
        path: md-editor-*-macos-universal.dmg
        retention-days: 14
