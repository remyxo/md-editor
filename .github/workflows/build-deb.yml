name: Build DEB Package

# 配额策略（2026-09-18）：Actions 制品存储 500MB 配额，日常 CI 只构建 macOS DMG；
# DEB 走本地构建测试（./scripts/build-deb.sh），EXE 走本地 win11 VM
# （./scripts/build-windows-local.sh）。本工作流转手动触发，仅发版前手动跑一次——
# ubuntu-26.04/Qt 6.10.2 是兼容基准（CLAUDE.md 原则 8），这是它仅存的自动化把关点
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # 获取 tag 信息

    - name: 安装构建依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake g++ \
          qt6-base-dev qt6-base-dev-tools \
          qt6-webengine-dev qt6-websockets-dev qt6-webengine-dev-tools \
          qt6-webchannel-dev \
          qmake6 \
          qt6-tools-dev qt6-tools-dev-tools

    - name: JS 测试 (vitest)
      working-directory: src/resources/web
      run: |
        npm ci
        npm test

    - name: 配置 CMake (Release)
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: 构建
      run: cmake --build build --parallel $(nproc)

    - name: 运行测试
      run: |
        cd build
        QT_QPA_PLATFORM=offscreen ctest --output-on-failure

    - name: 打包 DEB
      run: |
        cd build
        cpack -G DEB
        echo "=== 生成的 DEB 包 ==="
        ls -lh *.deb

    # Release 先于制品上传：制品上传受存储配额约束（重算 6-12h 滞后），
    # 上传失败不应连坐阻断 Release（与 build-windows/macos 一致）
    - name: 发布 Release（tag 推送时）
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: build/*.deb
        generate_release_notes: true

    - name: 上传 DEB 制品
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v7
      with:
        name: md-editor-deb
        path: build/*.deb
        retention-days: 14
