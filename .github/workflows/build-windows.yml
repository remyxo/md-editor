name: Build Windows Package

# 配额策略（2026-09-18）：Actions 制品存储 500MB 配额，日常 CI 只构建 macOS DMG；
# EXE 走本地 win11 VM 构建（./scripts/build-windows-local.sh），DEB 走本地构建
# （./scripts/build-deb.sh）。本工作流转手动触发，仅需要时手动跑
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # 获取 tag 信息

    - name: 安装打包工具 (NSIS + ImageMagick)
      shell: pwsh
      run: |
        choco install -y --no-progress nsis imagemagick

    - name: 设置 MSVC 环境
      uses: ilammy/msvc-dev-cmd@v1

    - name: 安装 Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'
        arch: 'win64_msvc2022_64'
        modules: 'qtwebengine qtwebchannel qtpositioning'
        cache: true

    - name: 生成应用图标 (.ico)
      shell: pwsh
      run: ./scripts/generate-icons-win.ps1

    - name: JS 测试 (vitest)
      working-directory: src/resources/web
      shell: pwsh
      run: |
        npm ci
        npm test

    - name: 配置 CMake (Release)
      shell: pwsh
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

    - name: 构建
      shell: pwsh
      run: cmake --build build

    - name: 打包 (NSIS 安装器)
      shell: pwsh
      run: ./scripts/package-windows.ps1 -SkipZip

    # Release 发布先于制品上传：Release 走 dist/ 文件直传（无 500MB 配额），
    # 制品上传受 Actions 存储配额约束且配额重算有 6-12h 滞后，
    # 若上传失败不应连坐阻断 Release（上传仅为 CI 侧留档）
    - name: 发布 Release（tag 推送时）
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/md-editor-*-win64.exe
        generate_release_notes: true

    - name: 上传制品
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v7
      with:
        name: md-editor-windows
        path: dist/md-editor-*-win64.exe
        retention-days: 14
